<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BTC Price and 200 DMA</title>
    <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        margin: 24px;
      }
      #chart {
        width: 100%;
        height: 80vh;
      }
      #err {
        color: #c00;
        white-space: pre-wrap;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div id="chart"></div>
    <div id="err"></div>

    <script>
      async function main() {
        const errEl = document.getElementById("err");

        try {
          // IMPORTANT: relative fetch, works for https://username.github.io/repo/
          const dataUrl = new URL("./data/200dma.json", window.location.href).toString();

          const resp = await fetch(dataUrl, { cache: "no-store" });
          if (!resp.ok) {
            throw new Error(`Fetch failed: ${resp.status} ${resp.statusText}\nURL: ${dataUrl}`);
          }

          const rows = await resp.json();
          if (!Array.isArray(rows) || rows.length === 0) {
            throw new Error(`Data JSON parsed but was empty or not an array.\nURL: ${dataUrl}`);
          }

          const x = rows.map(r => r.date);
          const price = rows.map(r => r.price);
          const dma200 = rows.map(r => r.dma200);

          const traces = [
            {
              x,
              y: price,
              name: "BTC Price",
              type: "scatter",
              mode: "lines",
              yaxis: "y2",
            },
            {
              x,
              y: dma200,
              name: "200 Day MA",
              type: "scatter",
              mode: "lines",
              yaxis: "y2",
            },
          ];

          const layout = {
            margin: { l: 40, r: 40, t: 10, b: 40 },
            xaxis: { title: "" },
            yaxis2: {
              title: "",
              type: "log",
              overlaying: "y",
              side: "right",
              showgrid: true,
            },
            legend: { orientation: "h", x: 0, y: 1.1 },
          };

          Plotly.newPlot("chart", traces, layout, { displayModeBar: true, responsive: true });
          errEl.textContent = "";
        } catch (e) {
          console.error(e);
          document.getElementById("err").textContent = "Error loading chart data\n\n" + (e && e.stack ? e.stack : String(e));
        }
      }

      main();
    </script>
  </body>
</html>
