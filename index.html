<script>
  async function load() {
    try {
      const r = await fetch("data/200dma.json", { cache: "no-store" });
      if (!r.ok) throw new Error(`404: ${r.url}`);
      const rows = await r.json();

      const x = rows.map(d => d.date);
      const price = rows.map(d => d.price);
      const dma = rows.map(d => d.dma200);

      const traces = [
        {
          x,
          y: price,
          name: "BTC Price",
          mode: "lines",
          line: { width: 2 }
        },
        {
          x,
          y: dma,
          name: "200 Day MA",
          mode: "lines",
          line: { width: 2 }
        }
      ];

      const layout = {
        margin: { l: 70, r: 30, t: 30, b: 50 },
        xaxis: {
          showgrid: false
        },
        yaxis: {
          type: "linear",
          tickprefix: "$",
          separatethousands: true,
          showgrid: true,
          gridcolor: "rgba(0,0,0,0.08)",
          zeroline: false
        },
        legend: {
          orientation: "h",
          x: 0,
          y: 1.05
        }
      };

      Plotly.newPlot("chart", traces, layout, {
        responsive: true,
        displaylogo: false
      });

    } catch (e) {
      document.getElementById("err").textContent = e.message;
      console.error(e);
    }
  }

  load();
</script>
