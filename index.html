<script>
  async function load() {
    try {
      const r = await fetch("data/200dma.json", { cache: "no-store" });
      if (!r.ok) throw new Error(`404: ${r.url}`);
      const rows = await r.json();

      const x = rows.map(d => d.date);
      const price = rows.map(d => d.price);
      const dma = rows.map(d => d.dma200);

      Plotly.newPlot("chart", [
        { x, y: price, name: "BTC Price", mode: "lines" },
        { x, y: dma, name: "200 DMA", mode: "lines" }
      ]);
    } catch (e) {
      document.getElementById("err").textContent = e.message;
      console.error(e);
    }
  }
  load();
</script>
