name: Update 200DMA

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pandas requests

      - name: Fetch data
        env:
          BMP_API_KEY: ${{ secrets.BMP_API_KEY }}
        run: python scripts/fetch_200dma.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/200dma.json
          git diff --cached --quiet || git commit -m "Update 200DMA"
          git push
