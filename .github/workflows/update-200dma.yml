name: Update 200DMA JSON

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Fetch 200DMA data
        env:
          BMP_API_KEY: ${{ secrets.BMP_API_KEY }}
        run: |
          python scripts/fetch_200dma.py

      - name: Commit and push data
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add docs/data/200dma.json
          git commit -m "Update 200DMA data" || echo "No changes to commit"
          git push
