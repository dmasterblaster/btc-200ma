name: Update 200WMA data

on:
  schedule:
    - cron: "5 0 * * *"   # daily at 00:05 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Fetch 200WMA data
        env:
          BMP_API_KEY: ${{ secrets.BMP_API_KEY }}
        run: python scripts/fetch_200wma.py

      - name: Commit and push data
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add data/200wma.json
          git commit -m "Update 200WMA data" || echo "No changes to commit"

          git push
